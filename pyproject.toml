[project]
name = "fuluoxiaojie-data-pipeline"
version = "1.0.0"
description = "Stdlib-only Python ETL pipeline and DAG invariant test suite for FuLuoXiaoJie."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.17.0",
  "deptry>=0.25.0",
  "mypy>=2.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["scripts/build-data"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes (unused imports, undefined names)
  "I",    # isort (import sorting)
  "B",    # flake8-bugbear
  "UP",   # pyupgrade (modern Python 3.12+ idioms)
  "SIM",  # flake8-simplify
]
ignore = [
  "E501", # line length handled by `ruff format`
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.deptry]
known_first_party = [
  "build_all",
  "build_audio",
  "build_examples",
  "build_graph",
  "build_strokes",
  "fetch_sources",
  "pinyin_utils",
  "test_dag_invariants",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "scripts/build-data"
files = ["scripts/build-data"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
